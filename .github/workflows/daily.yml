name: FUCHIACCIONES Daily
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/**'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build daily report
        run: python scripts/build_site.py
      - name: Add autonomous refresh control
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- FUCHIACCIONES_REFRESH -->'
          if marker not in s:
              css = """<style id='fuchiacciones-refresh-css'>
              #fuchi-refresh{position:fixed;left:14px;top:14px;z-index:9999;border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 3px 12px #0003}
              #fuchi-refresh:hover{opacity:.9} #fuchi-refresh:disabled{opacity:.6;cursor:wait}
              #fuchi-refresh-status{position:fixed;left:14px;top:55px;z-index:9998;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px 9px;font-size:11px;color:#6b7280;box-shadow:0 2px 8px #0001;display:none}
              @media(max-width:600px){#fuchi-refresh{left:8px;top:8px;padding:8px 10px}#fuchi-refresh-status{left:8px;top:48px}}
              </style>"""
              js = """<script id='fuchiacciones-refresh-js'>
              (function(){
                const marker = "<!-- FUCHIACCIONES_REFRESH -->";
                const html = '<button id="fuchi-refresh" type="button" aria-label="Actualizar información">↻ ACTUALIZAR</button><div id="fuchi-refresh-status" role="status"></div>';
                function init(){
                  if(document.getElementById('fuchi-refresh')) return;
                  document.body.insertAdjacentHTML('afterbegin', marker + html);
                  const btn=document.getElementById('fuchi-refresh'), status=document.getElementById('fuchi-refresh-status');
                  btn.addEventListener('click', async function(){
                    btn.disabled=true; btn.textContent='↻ ACTUALIZANDO…'; status.style.display='block'; status.textContent='Consultando la última información…';
                    try{
                      const r=await fetch('data.json?refresh='+Date.now(),{cache:'no-store'});
                      if(!r.ok) throw new Error('No se pudo consultar data.json');
                      await r.json();
                      status.textContent='Actualizando la página…';
                      window.location.replace(window.location.pathname+'?v='+Date.now());
                    }catch(e){
                      status.textContent='No se pudo actualizar ahora. Reintentá en unos segundos.';
                      btn.disabled=false; btn.textContent='↻ ACTUALIZAR';
                    }
                  });
                }
                if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
              })();
              </script>"""
              s = s.replace('</head>', css + '</head>', 1)
              s = s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated data
        run: |
          git config user.name 'fuchiacciones-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data.json public/index.html
          git diff --cached --quiet || git commit -m "Update daily FUCHIACCIONES report"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
